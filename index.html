<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c1013">
  <title>Position Quiz</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <div class="title-group">
      <h1 id="page-title">Position Quiz</h1>
      <a class="creator" href="https://www.youtube.com/@YANAGIBackgammon" target="_blank" rel="noopener noreferrer">Created by YANAGI Backgammon</a>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Quiz settings">
      <div class="type-tabs" role="group" aria-label="Position type">
        <button type="button" class="type-tab is-active" data-kind="checker">Checker Play <span class="type-count"><span data-count="checker">0</span></span></button>
        <button type="button" class="type-tab" data-kind="double">Double Action <span class="type-count"><span data-count="double">0</span></span></button>
        <button type="button" class="type-tab" data-kind="take">Take Action <span class="type-count"><span data-count="take">0</span></span></button>
      </div>
      <label class="challenge-toggle">
        <input id="challenge-only" type="checkbox">
        <span>Task</span>
        <span class="type-count"><span id="challenge-count">0</span></span>
      </label>
    </section>

    <section id="quiz-card" class="quiz-card" aria-live="polite">
      <div class="quiz-layout">
        <div class="position-column">
          <div class="board-wrap">
            <img id="board-image" alt="Backgammon quiz position">
          </div>

        </div>

        <div class="answer-column">
          <section id="answer-panel" class="answer-panel">
            <div class="answer-heading">
              <span>Best Action</span>
              <strong id="best-answer" class="answer-data" data-answer-data aria-hidden="true">—</strong>
            </div>

            <div class="analysis-section">
              <div class="analysis-grid answer-data" data-answer-data aria-hidden="true">
                <div id="action-analysis" class="action-analysis"></div>
                <div id="summary-analysis" class="summary-analysis"></div>
              </div>
            </div>

            <div class="judge-area">
              <button id="answer-button" class="primary-button answer-button" type="button">Answer</button>
              <div id="judge-buttons" class="judge-buttons" hidden>
                <button id="correct-button" class="judge-button correct-button" type="button" aria-label="Correct">○</button>
                <button id="wrong-button" class="judge-button wrong-button" type="button" aria-label="Incorrect">×</button>
              </div>
              <p id="judged-message" class="judged-message" hidden></p>
              <button id="next-button" class="primary-button next-button" type="button" hidden>Next</button>
            </div>

            <div id="source-file" class="source-file answer-data" data-answer-data aria-hidden="true"></div>
          </section>
        </div>
      </div>
    </section>

    <section id="empty-state" class="empty-state" hidden>
      <strong>No positions match the selected conditions.</strong>
      <span>Change the position type or turn off Task mode.</span>
    </section>

    <section class="records-row" aria-label="Quiz records">
      <div id="position-record" class="record-group" aria-label="This Position record">
        <span class="record-label">This Position</span>
        <strong id="position-correct" class="record-number record-correct" aria-label="Correct">0</strong>
        <strong id="position-wrong" class="record-number record-wrong" aria-label="Incorrect">0</strong>
      </div>
      <div class="record-group" aria-label="Total record">
        <span class="record-label">Total</span>
        <strong id="total-correct" class="record-number record-correct" aria-label="Correct">0</strong>
        <strong id="total-wrong" class="record-number record-wrong" aria-label="Incorrect">0</strong>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
