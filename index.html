<!doctype html>
<html lang="ja" id="top">
<head>

  <title>YANAGI Backgammon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="./assets/style.css">

<body>
  <div class="site-shell">
    <div class="bg-art" aria-hidden="true">
      <span class="shape circle circle-a"></span>
      <span class="shape circle circle-b"></span>

      <span class="shape square square-a"></span>
      <span class="shape square square-b"></span>
      <span class="shape square square-c"></span>
      <span class="shape square square-d"></span>

    <header class="site-header">
      <div class="brand" aria-label="YANAGI Backgammon">
        <div class="brand-mark" aria-hidden="true">

        </div>

        <a class="cta-button" href="/position-drill/">Position Drill へ</a>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> YANAGI Backgammon</p>
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
